# Cross build for the S10e (Mobian, aarch64): clang + lld against the phone's
# own rootfs for GLib/GIO, plus a small overlay carrying the ALSA and libsrtp2
# headers and libraries that rootfs has no -dev packages for.
#   meson setup build-arm64 --cross-file cross-arm64.ini && ninja -C build-arm64
[constants]
sysroot = '/media/pulp/VP5/S10e/neo-sysroot'
overlay = '/media/pulp/VP5/S10e/gsm2sip-sysroot'

[binaries]
c = ['clang', '--target=aarch64-linux-gnu', '--sysroot=' + sysroot]
pkg-config = 'pkg-config'
strip = 'llvm-strip'

[built-in options]
c_args = ['-I' + overlay + '/usr/include']
c_link_args = ['-fuse-ld=lld', '-L' + overlay + '/usr/lib/aarch64-linux-gnu']
pkg_config_path = ''

[properties]
sys_root = sysroot
pkg_config_libdir = [sysroot + '/usr/lib/aarch64-linux-gnu/pkgconfig', sysroot + '/usr/share/pkgconfig',
                     overlay + '/usr/lib/aarch64-linux-gnu/pkgconfig']

[host_machine]
system = 'linux'
cpu_family = 'aarch64'
cpu = 'aarch64'
endian = 'little'
