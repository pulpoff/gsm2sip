# Layer on top of cross-arm64.ini to run the unit tests on the build machine
# under qemu-user, against the phone's own GLib -- aarch64 is where `char` is
# unsigned, so this is the run that catches signedness slips:
#   meson setup build-arm64-test --cross-file cross-arm64.ini --cross-file cross-arm64-qemu.ini
#   meson test -C build-arm64-test
[binaries]
exe_wrapper = ['qemu-aarch64', '-L', '/media/pulp/VP5/S10e/neo-sysroot']
