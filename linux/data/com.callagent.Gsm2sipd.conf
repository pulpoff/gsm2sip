<?xml version="1.0"?>
<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<!-- gsm2sipd's control interface, for the gsm2sip app.  It reads the recent
     calls and messages and rewrites the gateway's settings, so it is not for
     everyone: only for those who may use the modem directly anyway (dialout,
     which the phone's own user is in on Mobian). -->
<busconfig>
  <policy user="root">
    <allow own="com.callagent.Gsm2sipd"/>
    <allow send_destination="com.callagent.Gsm2sipd"/>
  </policy>
  <policy group="dialout">
    <allow send_destination="com.callagent.Gsm2sipd"/>
  </policy>
  <policy context="default">
    <deny send_destination="com.callagent.Gsm2sipd"/>
  </policy>
</busconfig>
