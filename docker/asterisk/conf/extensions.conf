; Dialplan for one gsm2sip gateway and a handful of SIP clients.
;
;   GSM call to the SIM   -> rings every registered client at once
;   client dials a number -> placed through the gateway's SIM
;   client dials 600      -> echo test (checks the client alone)
;   SMS to the SIM        -> delivered to every registered client
;   client sends a text   -> sent as an SMS through the gateway
;
; SERVER_IP, GATEWAY and CLIENTS come from .env via entrypoint.sh.

[general]
static=yes
writeprotect=yes

#include extensions_globals.conf

; ── Calls ────────────────────────────────────────────────────────────

; From the gateway: EXTEN is the SIM's own number, CALLERID(num) the caller.
[from-gateway]
exten => _[+0-9].,1,Goto(gsm-in,s,1)
exten => s,1,Goto(gsm-in,s,1)

[gsm-in]
exten => s,1,NoOp(GSM call from ${CALLERID(num)})
 same => n,Gosub(sub-registered-clients,s,1)
 same => n,GotoIf($["${DIALSTR}" = ""]?nobody)
; Give the gateway time: it answers the GSM leg only once SIP is up
 same => n,Dial(${DIALSTR},60)
 same => n,Hangup()
 same => n(nobody),Answer()
 same => n,Playback(vm-nobodyavail)
 same => n,Hangup()

; From a client: any number goes out through the SIM.
[from-clients]
exten => 600,1,Goto(echo-test,s,1)
exten => _+X.,1,Dial(PJSIP/${EXTEN}@${GLOBAL(GATEWAY)},60)
 same => n,Hangup()
exten => _X.,1,Dial(PJSIP/${EXTEN}@${GLOBAL(GATEWAY)},60)
 same => n,Hangup()

[echo-test]
exten => s,1,Answer()
 same => n,Playback(demo-echotest)
 same => n,Echo()
 same => n,Hangup()

; Sets DIALSTR to every contact of every registered client, joined with &,
; or to "" when nobody is registered.
[sub-registered-clients]
exten => s,1,Set(DIALSTR=)
 same => n,Set(LOCAL(list)=${GLOBAL(CLIENTS)})
 same => n(next),Set(LOCAL(c)=${SHIFT(list)})
 same => n,GotoIf($["${c}" = ""]?done)
 same => n,Set(LOCAL(ct)=${PJSIP_DIAL_CONTACTS(${c})})
 same => n,GotoIf($["${ct}" = ""]?next)
 same => n,GotoIf($["${DIALSTR}" = ""]?first)
 same => n,Set(DIALSTR=${DIALSTR}&${ct})
 same => n,Goto(next)
 same => n(first),Set(DIALSTR=${ct})
 same => n,Goto(next)
 same => n(done),Return()

; ── SMS ──────────────────────────────────────────────────────────────

; From the gateway: received SMS and delivery reports, both addressed to the
; SIM's own number.  Only reports carry X-SMS-Event.
[sms-from-gateway]
exten => _[+0-9].,1,Set(FROMNUM=${MESSAGE_DATA(X-SMS-From)})
 same => n,Set(ID=${MESSAGE_DATA(X-SMS-Id)})
 same => n,Set(EVENT=${MESSAGE_DATA(X-SMS-Event)})
 same => n,GotoIf($["${EVENT}" != ""]?report)
 same => n,GotoIf($["${ID}" != ""]?store)
 same => n,Set(ID=${EPOCH}-${RAND()})
; PJSIP has already answered the gateway 202 by now, so the gateway will not
; retry: keep a copy before trying anyone, and drop it once someone has it.
 same => n(store),Set(DB(sms-in/${ID})=${STRFTIME(${EPOCH},,%Y-%m-%d %H:%M:%S)} ${FROMNUM} ${MESSAGE(body)})
 same => n,Set(SENT=0)
 same => n,Set(list=${GLOBAL(CLIENTS)})
 same => n(next),Set(c=${SHIFT(list)})
 same => n,GotoIf($["${c}" = ""]?done)
 same => n,GotoIf($["${PJSIP_DIAL_CONTACTS(${c})}" = ""]?next)
; From is the sender's number, so a client's reply comes back addressed to it
 same => n,MessageSend(pjsip:${c},sip:${FROMNUM}@${GLOBAL(SERVER_IP)})
 same => n,ExecIf($["${MESSAGE_SEND_STATUS}" = "SUCCESS"]?Set(SENT=$[${SENT} + 1]))
 same => n,Goto(next)
 same => n(done),Verbose(1,SMS ${ID} from ${FROMNUM} delivered to ${SENT} client(s))
; Not ExecIf: its argument is expanded before the condition is tested, so a
; ${DB_DELETE()} inside it would run either way.
 same => n,GotoIf($[${SENT} = 0]?kept)
 same => n,NoOp(${DB_DELETE(sms-in/${ID})})
 same => n,Hangup()
 same => n(kept),Verbose(1,SMS ${ID} kept: no client registered (database show sms-in))
 same => n,Hangup()
 same => n(report),Verbose(1,SMS report ${ID}: ${EVENT} to=${MESSAGE_DATA(X-SMS-To)} status=${MESSAGE_DATA(X-SMS-Status)} reason=${MESSAGE_DATA(X-SMS-Reason)})
 same => n,Hangup()

; From a client: EXTEN is the recipient.  Clients also send is-composing and
; read-receipt notifications as XML MESSAGEs; those must not become SMS.
[sms-from-clients]
exten => _[+0-9].,1,GotoIf($["${MESSAGE(body):0:5}" = "<?xml"]?ignore)
 same => n,Set(MESSAGE_DATA(X-SMS-To)=${EXTEN})
 same => n,MessageSend(pjsip:${GLOBAL(GATEWAY)},sip:${GLOBAL(SERVER_IP)})
 same => n,Verbose(1,SMS to ${EXTEN} handed to the gateway: ${MESSAGE_SEND_STATUS})
 same => n(ignore),Hangup()
